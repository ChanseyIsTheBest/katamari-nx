# katamari-nx (Beautiful Katamari, title 4E4D07DC, XDK 2.0.5632) - ReXGlue codegen configuration.
# The project keeps banjo-nx's internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets,
# out/renut_image.bin) so banjo-nx's CMake, post-codegen passes and renderer glue work unchanged; the NRO and the SD
# folder are katamari-nx (docs/katamari-notes.md, "Decisions").

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true
# The register "diet" keys (non_volatile_as_local, elide_lr_stores, non_argument_as_local) need this game's audits
# (tools/read_before_write.py, tools/non_argument_audit.py) first: they are added after the first codegen's audit
# (docs/katamari-notes.md, "Code generation").

# setjmp / longjmp (peggle2-nx's method, by shape; tools/ppc_dis.py): setjmp 0x827EB5D0 saves f14-f31 then r13-r31 into
# the buffer at r3 (`stfd f14,0(r3)` ... `std r13,152(r3)`), after a check of a hook word (`lwz r0,-11412(r4);
# bnectr`); longjmp 0x827EB3B0 reloads them from the buffer (`mr r7,r3` ... `lfd f14,0(r7)`). 4+ setjmp callers,
# about 20 longjmp callers (0x828AD3C8 ... 0x829A52C4).
setjmp_address = 0x827EB5D0
longjmp_address = 0x827EB3B0

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"

